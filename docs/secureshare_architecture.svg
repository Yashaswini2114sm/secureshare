<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cryptoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311042" />
      <stop offset="100%" stop-color="#13091f" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="storageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <!-- Filters for Glow / Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="accentGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="40" y="25" width="1120" height="70" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)" />
  <text x="70" y="60" fill="#38bdf8" font-size="22" font-weight="bold">🔐 SECURESHARE — UNIFIED SYSTEM ARCHITECTURE</text>
  <text x="70" y="80" fill="#94a3b8" font-size="13">Zero-Trust Cryptographic File Vault • Mandatory Owner Approval • Bit-Level SHA-256 Integrity • Defense-in-Depth</text>
  <rect x="990" y="42" width="145" height="34" rx="8" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
  <text x="1005" y="64" fill="#38bdf8" font-size="12" font-weight="bold">FASTAPI + NEXT.JS</text>

  <!-- ================= TIER 1: CLIENT PRESENTATION ================= -->
  <rect x="40" y="115" width="1120" height="150" rx="14" fill="#0d1527" stroke="#1e293b" stroke-width="1.5" filter="url(#cardShadow)" />
  <rect x="40" y="115" width="280" height="28" rx="8" fill="#1e293b" />
  <text x="55" y="134" fill="#38bdf8" font-size="12" font-weight="bold">1. CLIENT PRESENTATION TIER (NEXT.JS 16 / REACT 19)</text>

  <!-- Client Box 1: File Owner -->
  <rect x="65" y="155" width="240" height="92" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="80" y="180" fill="#ffffff" font-size="14" font-weight="bold">👑 File Owner (Sender)</text>
  <text x="80" y="200" fill="#94a3b8" font-size="11">• Uploads File (AES-256-CBC)</text>
  <text x="80" y="217" fill="#94a3b8" font-size="11">• Dashboard: Approve / Reject / Revoke</text>
  <text x="80" y="234" fill="#34d399" font-size="11">✓ Full File Management</text>

  <!-- Client Box 2: Recipient -->
  <rect x="330" y="155" width="240" height="92" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1" />
  <text x="345" y="180" fill="#ffffff" font-size="14" font-weight="bold">👤 Recipient (Visitor)</text>
  <text x="345" y="200" fill="#94a3b8" font-size="11">• Opens Restricted Sharing Link</text>
  <text x="345" y="217" fill="#94a3b8" font-size="11">• Submits "Request Access"</text>
  <text x="345" y="234" fill="#fbbf24" font-size="11">⏳ Awaits Owner Approval to Decrypt</text>

  <!-- Client Box 3: WebCrypto Engine -->
  <rect x="595" y="155" width="260" height="92" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
  <text x="610" y="180" fill="#ffffff" font-size="14" font-weight="bold">⚡ WebCrypto API (Browser)</text>
  <text x="610" y="200" fill="#94a3b8" font-size="11">• Ephemeral ECDH P-256 Keypair</text>
  <text x="610" y="217" fill="#94a3b8" font-size="11">• window.crypto.subtle Keygen</text>
  <text x="610" y="234" fill="#c084fc" font-size="11">🛡️ Zero Key Exposure over Network</text>

  <!-- Client Box 4: 2FA TOTP App -->
  <rect x="880" y="155" width="255" height="92" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1" />
  <text x="895" y="180" fill="#ffffff" font-size="14" font-weight="bold">📱 Google Authenticator</text>
  <text x="895" y="200" fill="#94a3b8" font-size="11">• RFC 6238 TOTP 2FA</text>
  <text x="895" y="217" fill="#94a3b8" font-size="11">• HMAC-SHA1 6-Digit Rotating OTP</text>
  <text x="895" y="234" fill="#34d399" font-size="11">✓ Neutralizes Credential Stuffing</text>

  <!-- Connections Tier 1 -> Tier 2 -->
  <line x1="185" y1="247" x2="185" y2="295" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="450" y1="247" x2="450" y2="295" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)" />
  <line x1="725" y1="247" x2="725" y2="295" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)" />
  <line x1="1005" y1="247" x2="1005" y2="295" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)" />

  <!-- ================= TIER 2: API GATEWAY & SECURITY LAYER ================= -->
  <rect x="40" y="300" width="1120" height="135" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)" />
  <rect x="40" y="300" width="310" height="28" rx="8" fill="#1e293b" />
  <text x="55" y="319" fill="#38bdf8" font-size="12" font-weight="bold">2. SECURITY GATEWAY & MIDDLEWARE (FASTAPI)</text>

  <!-- Gateway Box 1: Reverse Proxy & CORS -->
  <rect x="65" y="340" width="240" height="78" rx="10" fill="#131e33" stroke="#475569" stroke-width="1" />
  <text x="80" y="365" fill="#f8fafc" font-size="13" font-weight="bold">🌐 CORS & Headers</text>
  <text x="80" y="385" fill="#94a3b8" font-size="11">• Origin Whitelist (Port 3000)</text>
  <text x="80" y="402" fill="#94a3b8" font-size="11">• Exposed Headers: X-File-Hash</text>

  <!-- Gateway Box 2: Rate Limiting -->
  <rect x="330" y="340" width="240" height="78" rx="10" fill="#131e33" stroke="#f43f5e" stroke-width="1" />
  <text x="345" y="365" fill="#f8fafc" font-size="13" font-weight="bold">🛑 SlowAPI Rate Limiter</text>
  <text x="345" y="385" fill="#94a3b8" font-size="11">• Token Bucket Algorithm</text>
  <text x="345" y="402" fill="#fda4af" font-size="11">• Max 5 attempts/min on Auth</text>

  <!-- Gateway Box 3: JWT Bearer Token -->
  <rect x="595" y="340" width="260" height="78" rx="10" fill="#131e33" stroke="#38bdf8" stroke-width="1" />
  <text x="610" y="365" fill="#f8fafc" font-size="13" font-weight="bold">🔑 JWT Bearer Authenticator</text>
  <text x="610" y="385" fill="#94a3b8" font-size="11">• HMAC-SHA256 Token Signature</text>
  <text x="610" y="402" fill="#38bdf8" font-size="11">• Header & ?token= Query Support</text>

  <!-- Gateway Box 4: Audit & Telemetry -->
  <rect x="880" y="340" width="255" height="78" rx="10" fill="#131e33" stroke="#34d399" stroke-width="1" />
  <text x="895" y="365" fill="#f8fafc" font-size="13" font-weight="bold">📊 Audit Telemetry Engine</text>
  <text x="895" y="385" fill="#94a3b8" font-size="11">• Tracks IP, User-Agent, Action</text>
  <text x="895" y="402" fill="#34d399" font-size="11">• 2FA_FAIL, REQ, APP, REVOKE</text>

  <!-- Connections Tier 2 -> Tier 3 -->
  <line x1="200" y1="418" x2="200" y2="465" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="500" y1="418" x2="500" y2="465" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)" />
  <line x1="800" y1="418" x2="800" y2="465" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)" />
  <line x1="1000" y1="418" x2="1000" y2="465" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)" />

  <!-- ================= TIER 3: BUSINESS LOGIC & ACCESS CONTROL ================= -->
  <rect x="40" y="470" width="1120" height="150" rx="14" fill="#0d1527" stroke="#1e293b" stroke-width="1.5" filter="url(#cardShadow)" />
  <rect x="40" y="470" width="370" height="28" rx="8" fill="#1e293b" />
  <text x="55" y="489" fill="#38bdf8" font-size="12" font-weight="bold">3. ACCESS CONTROL & BUSINESS CONTROLLERS</text>

  <!-- Box 1: Owner Approval State Machine -->
  <rect x="65" y="510" width="350" height="92" rx="10" fill="#1a2234" stroke="#fbbf24" stroke-width="1.2" />
  <text x="80" y="534" fill="#ffffff" font-size="13" font-weight="bold">🛡️ Owner Approval Engine</text>
  <text x="80" y="554" fill="#94a3b8" font-size="11">• State Matrix: NONE ➔ PENDING ➔ APPROVED / REJECTED</text>
  <text x="80" y="571" fill="#94a3b8" font-size="11">• Dynamic Revocation: APPROVED ➔ REVOKED</text>
  <text x="80" y="588" fill="#f87171" font-size="11">⛔ Direct Access Blocked: 401 Unauthorized / 403 Forbidden</text>

  <!-- Box 2: File Policy Controller -->
  <rect x="435" y="510" width="340" height="92" rx="10" fill="#1a2234" stroke="#38bdf8" stroke-width="1.2" />
  <text x="450" y="534" fill="#ffffff" font-size="13" font-weight="bold">📁 File Lifecycle & Policy Gate</text>
  <text x="450" y="554" fill="#94a3b8" font-size="11">• One-Time Self-Destruct Enforcement (is_one_time)</text>
  <text x="450" y="571" fill="#94a3b8" font-size="11">• Expiration Timers with UTC Normalization</text>
  <text x="450" y="588" fill="#38bdf8" font-size="11">• Download Limit Counter (max_downloads)</text>

  <!-- Box 3: Anti-Forensic Shredder -->
  <rect x="795" y="510" width="340" height="92" rx="10" fill="#1a2234" stroke="#f43f5e" stroke-width="1.2" />
  <text x="810" y="534" fill="#ffffff" font-size="13" font-weight="bold">🗑️ Anti-Forensic File Shredder</text>
  <text x="810" y="554" fill="#94a3b8" font-size="11">• DoD 5220.22-M Compliance Concept</text>
  <text x="810" y="571" fill="#94a3b8" font-size="11">• Overwrites physical sectors with os.urandom()</text>
  <text x="810" y="588" fill="#fda4af" font-size="11">• Forces hardware flush with os.fsync() before deletion</text>

  <!-- Connections Tier 3 -> Tier 4 -->
  <line x1="240" y1="602" x2="240" y2="650" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="605" y1="602" x2="605" y2="650" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)" />
  <line x1="965" y1="602" x2="965" y2="650" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)" />

  <!-- ================= TIER 4: APPLIED CRYPTOGRAPHY CORE ================= -->
  <rect x="40" y="655" width="1120" height="100" rx="14" fill="#180d28" stroke="#7e22ce" stroke-width="1.5" filter="url(#cardShadow)" />
  <rect x="40" y="655" width="350" height="26" rx="8" fill="#3b0764" />
  <text x="55" y="672" fill="#c084fc" font-size="12" font-weight="bold">4. APPLIED CRYPTOGRAPHIC CORE ENGINE</text>

  <!-- Crypto Box 1: ECDH P-256 -->
  <rect x="65" y="690" width="250" height="52" rx="8" fill="#2e1065" stroke="#a855f7" stroke-width="1" />
  <text x="75" y="711" fill="#ffffff" font-size="12" font-weight="bold">🔑 Ephemeral ECDH P-256</text>
  <text x="75" y="728" fill="#c084fc" font-size="10">Elliptic Curve Key Agreement (RFC 5903)</text>

  <!-- Crypto Box 2: HKDF-SHA256 -->
  <rect x="335" y="690" width="250" height="52" rx="8" fill="#2e1065" stroke="#a855f7" stroke-width="1" />
  <text x="345" y="711" fill="#ffffff" font-size="12" font-weight="bold">⚙️ HKDF-SHA256 Expander</text>
  <text x="345" y="728" fill="#c084fc" font-size="10">Extract-and-Expand to 256-bit AES Key</text>

  <!-- Crypto Box 3: AES-256-CBC -->
  <rect x="605" y="690" width="250" height="52" rx="8" fill="#2e1065" stroke="#38bdf8" stroke-width="1" />
  <text x="615" y="711" fill="#ffffff" font-size="12" font-weight="bold">🔒 AES-256-CBC Encryption</text>
  <text x="615" y="728" fill="#38bdf8" font-size="10">256-bit Key + 128-bit Random IV (PKCS#7)</text>

  <!-- Crypto Box 4: SHA-256 Hasher -->
  <rect x="875" y="690" width="260" height="52" rx="8" fill="#2e1065" stroke="#34d399" stroke-width="1" />
  <text x="885" y="711" fill="#ffffff" font-size="12" font-weight="bold">🛡️ SHA-256 Integrity Verifier</text>
  <text x="885" y="728" fill="#34d399" font-size="10">Bit-for-Bit Pre & Post Download Check</text>

  <!-- Connections Tier 4 -> Tier 5 -->
  <line x1="300" y1="755" x2="300" y2="785" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)" />
  <line x1="850" y1="755" x2="850" y2="785" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)" />

  <!-- ================= TIER 5: PERSISTENCE & STORAGE ================= -->
  <rect x="40" y="790" width="1120" height="95" rx="14" fill="#04231b" stroke="#059669" stroke-width="1.5" filter="url(#cardShadow)" />
  <rect x="40" y="790" width="300" height="26" rx="8" fill="#064e3b" />
  <text x="55" y="807" fill="#34d399" font-size="12" font-weight="bold">5. PERSISTENCE & ZERO-TRUST STORAGE TIER</text>

  <!-- DB Box: Relational Metadata -->
  <rect x="65" y="825" width="520" height="48" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <text x="80" y="845" fill="#ffffff" font-size="12" font-weight="bold">🗄️ Relational Database (SQLAlchemy Async - SQLite / PostgreSQL)</text>
  <text x="80" y="862" fill="#6ee7b7" font-size="11">Tables: users (Bcrypt, TOTP) • files (IV, Key, Hash) • access_requests • audit_logs • download_logs</text>

  <!-- Disk Box: Encrypted Payloads -->
  <rect x="615" y="825" width="520" height="48" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <text x="630" y="845" fill="#ffffff" font-size="12" font-weight="bold">💾 Zero-Trust Disk Storage (./uploads/)</text>
  <text x="630" y="862" fill="#6ee7b7" font-size="11">Unreadable Ciphertext Blobs (.enc) • Zero Plaintext at Rest • Anti-Forensic Overwritten on Delete</text>

</svg>